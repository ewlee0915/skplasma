<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SK플라즈마 결제청구 에이전트 — 디자인 시안 6종 비교</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      color: #182638;
      background: #eef1f5;
      transition: background-color 0.25s ease;
    }

    /* =========================================
       시안 전환 컨트롤 바 (비교용)
       ========================================= */
    .design-switcher {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 14px;
      background: #111927;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .design-switcher-label {
      margin-right: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #9fb0c7;
    }

    .design-switcher button {
      padding: 6px 12px;
      border: 1px solid #33445c;
      border-radius: 999px;
      background: #1e2a3b;
      color: #d6e0ed;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .design-switcher button:hover {
      border-color: #6b85a8;
      color: #fff;
    }

    .design-switcher button.active {
      border-color: #b71935;
      background: #b71935;
      color: #fff;
      box-shadow: 0 2px 10px rgba(183, 25, 53, 0.45);
    }

    /* 공통 요소 스타일 */
    .logo-fallback {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 900;
      font-size: 20px;
      color: #d71920;
      letter-spacing: -0.5px;
    }

    .logo-fallback span {
      color: #f37021;
      font-weight: 700;
    }

    kbd {
      padding: 1px 5px;
      border: 1px solid #d0d7e2;
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #f8fafc;
      font-family: inherit;
      font-size: 11px;
      color: #334155;
    }

    textarea.demo-textarea {
      width: 100%;
      padding: 16px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      transition: border-color 0.2s, background-color 0.2s;
    }

    textarea.demo-textarea:focus {
      outline: none;
      border-style: solid;
      border-color: #073b72;
      background: #fff;
    }

    .btn-primary {
      width: 100%;
      padding: 15px 20px;
      border: 0;
      border-radius: 10px;
      background: #b71935;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background: #96132a;
    }

    .util-btn {
      padding: 6px 11px;
      border: 1px solid #d3dae3;
      border-radius: 7px;
      background: #fff;
      color: #475569;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .util-btn:hover {
      border-color: #b71935;
      color: #b71935;
    }

    /* 시안 섹션 전환 */
    .mockup-section {
      display: none;
    }

    .mockup-section.active {
      display: block;
    }

    /* =========================================
       시안 1: 좌우 분할 워크스페이스형 (Split-Screen)
       ========================================= */
    .s1-container {
      max-width: 1140px;
      margin: 28px auto;
      padding: 0 20px;
    }

    .s1-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .s1-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: stretch;
    }

    .s1-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 24px;
      border-radius: 18px;
      background: linear-gradient(160deg, #ffffff 40%, #fff4ef 100%);
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }

    .s1-title {
      margin: 14px 0 8px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: #1e293b;
    }

    .s1-sub {
      margin: 0 0 24px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }

    .s1-step-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .s1-step-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #e2e8f0;
    }

    .s1-step-list li.active {
      border-color: #d98292;
      background: #fff;
      box-shadow: 0 3px 10px rgba(183, 25, 53, 0.08);
    }

    .s1-badge {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .s1-step-list li.active .s1-badge {
      background: #b71935;
      color: #fff;
    }

    .s1-security {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed #cbd5e1;
      font-size: 11.5px;
      color: #475569;
      line-height: 1.6;
    }

    .s1-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }

    .s1-right-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .s1-right-header h2 {
      margin: 0;
      font-size: 18px;
      color: #1e293b;
    }

    .s1-notice {
      padding: 12px 14px;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 12px;
      color: #475569;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .s1-bottom-bar {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 14px;
      margin-top: 18px;
      align-items: center;
    }

    .s1-month-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
    }

    /* =========================================
       시안 2: 딥 네이비 엔터프라이즈형 (Corporate Trust)
       ========================================= */
    .s2-header {
      background: #073b72;
      color: #fff;
      padding: 18px 0 36px;
    }

    .s2-header-inner {
      max-width: 840px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .s2-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .s2-nav .util-btn {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      color: #f1f5f9;
    }

    .s2-nav .util-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .s2-hero-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 22px;
    }

    .s2-hero-row h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .s2-hero-row p {
      margin: 0;
      font-size: 13px;
      color: #b8cde6;
    }

    .s2-pills {
      display: flex;
      gap: 8px;
    }

    .s2-pill {
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 12px;
      color: #e2ecf7;
    }

    .s2-main {
      max-width: 840px;
      margin: -20px auto 32px;
      padding: 0 20px;
    }

    .s2-card {
      background: #fff;
      border-radius: 14px;
      padding: 26px;
      border: 1px solid #d8e1ec;
      box-shadow: 0 8px 24px rgba(7, 59, 114, 0.08);
    }

    .s2-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }

    .s2-step {
      padding: 12px 14px;
      border-radius: 8px;
      background: #f4f7fb;
      border-left: 3px solid #94a3b8;
    }

    .s2-step.active {
      background: #edf4fc;
      border-left-color: #073b72;
    }

    .s2-step small {
      display: block;
      font-size: 10px;
      font-weight: 800;
      color: #073b72;
    }

    .s2-step strong {
      font-size: 13px;
      color: #1e293b;
    }

    /* =========================================
       시안 3: 미니멀 원카드 집중형 (Clean Minimal SaaS)
       ========================================= */
    .s3-wrap {
      max-width: 720px;
      margin: 34px auto;
      padding: 0 16px;
    }

    .s3-top-links {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .s3-top-links a {
      color: #526276;
      text-decoration: none;
      cursor: pointer;
    }

    .s3-top-links a:hover {
      color: #b71935;
      text-decoration: underline;
    }

    .s3-single-card {
      background: #fff;
      border-radius: 22px;
      padding: 36px 38px;
      border: 1px solid #e5eaf1;
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
    }

    .s3-head {
      text-align: center;
      margin-bottom: 26px;
    }

    .s3-head h1 {
      margin: 10px 0 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .s3-stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
    }

    .s3-stepper .step-now {
      color: #b71935;
      font-weight: 700;
    }

    .s3-stepper .arrow {
      color: #cbd5e1;
    }

      justify-content: space-between;
      align-items: center;

      font
